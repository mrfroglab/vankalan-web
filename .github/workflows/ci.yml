name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main # main dijalankan lewat deploy.yml (memanggil workflow ini)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Verify migrations are in sync with schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Skema berubah tapi migrasi belum digenerate. Jalankan 'pnpm db:generate' dan commit folder drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Build (tanpa DATABASE_URL)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
